name: mybudga
description: "Personal finance budgeting app — YNAB4-style envelope budgeting"
publish_to: 'none'

version: 2.2.127+158

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # SMS parsing
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.5

  # Backup / share
  share_plus: ^10.0.0
  path_provider: ^2.1.0

  # File picking (YNAB import)
  file_picker: ^8.1.0

  # Charts
  fl_chart: ^0.68.0

  # Expanded icon set (Material Symbols — ~3 000 icons, variable font)
  material_symbols_icons: ^4.0.0

  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Local notifications (Path B — shopping reminders)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Splash
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_native_splash:
  color: "#5C00F2"
  color_dark: "#5C00F2"
  image: assets/icons/app_icon.png
  android_12:
    image: assets/icons/app_icon.png
    icon_background_color: "#5C00F2"
  fullscreen: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5C00F2"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
